<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root{
    --bg:#f4f1ec; --panel:#fbf9f6; --ink:#1a1917; --mute:#7c766c;
    --line:#ddd6cb; --accent:#b4471f; --shadow:0 1px 2px rgba(26,25,23,.06),0 8px 24px rgba(26,25,23,.05);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#141311;--panel:#1c1b18;--ink:#eae6df;--mute:#918a7e;--line:#302d28;--accent:#e0703f;
          --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       -webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:1500px;margin:0 auto;padding:40px 28px 96px}

  header.top{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;
             padding-bottom:18px;border-bottom:1.5px solid var(--ink)}
  h1{font-size:clamp(28px,4.5vw,46px);margin:0;letter-spacing:-.025em;font-weight:600}
  .sub{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}

  /* house rules */
  .rules{margin:28px 0 8px;border:1px solid var(--line);background:var(--panel);border-radius:3px;overflow:hidden}
  .rules-hd{display:flex;justify-content:space-between;padding:11px 18px;border-bottom:1px solid var(--line);
            font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--mute)}
  .rules-body{display:grid;grid-template-columns:1fr 1fr;gap:0}
  @media(max-width:720px){.rules-body{grid-template-columns:1fr}}
  .rulecol{padding:20px 22px}
  .rulecol+.rulecol{border-left:1px solid var(--line)}
  @media(max-width:720px){.rulecol+.rulecol{border-left:0;border-top:1px solid var(--line)}}
  .rulecol h3{margin:0 0 12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--mute);font-weight:500}
  .rulecol ul{margin:0;padding-left:16px}
  .rulecol li{margin:0 0 7px;font-size:14.5px}
  .rulecol.never li{color:var(--accent)}
  li.empty{list-style:none;margin-left:-16px;color:var(--mute)}

  /* controls */
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:26px 0 20px}
  .chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;padding:7px 12px;border:1px solid var(--line);
        background:transparent;color:var(--ink);border-radius:2px;cursor:pointer;transition:.14s}
  .chip:hover{border-color:var(--ink)}
  .chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .chip em{font-style:normal;opacity:.55;margin-left:3px}
  .search{margin-left:auto;font-family:var(--mono);font-size:12px;padding:8px 12px;min-width:210px;
          border:1px solid var(--line);border-radius:2px;background:var(--panel);color:var(--ink)}
  .search:focus{outline:none;border-color:var(--ink)}

  /* grid */
  .grid{columns:3 340px;column-gap:22px}
  .card{break-inside:avoid;margin-bottom:22px;background:var(--panel);border:1px solid var(--line);
        border-radius:3px;overflow:hidden;box-shadow:var(--shadow);transition:.16s}
  .card:hover{transform:translateY(-2px);border-color:var(--mute)}
  .card.hide{display:none}
  .shot{background:var(--bg);border-bottom:1px solid var(--line);line-height:0}
  .shot img{width:100%;height:auto;display:block}
  .noimg{padding:52px 0;text-align:center;font-family:var(--mono);font-size:11px;color:var(--mute);line-height:1.4}
  .meta{padding:14px 16px 15px}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .ttl{font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
  a.ttl:hover{color:var(--accent)}
  .src{font-family:var(--mono);font-size:10px;color:var(--mute);white-space:nowrap;letter-spacing:.04em}
  .why{margin:8px 0 0;font-size:13.5px;color:var(--mute);line-height:1.45}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
  .tag{font-family:var(--mono);font-size:10px;letter-spacing:.05em;padding:3px 7px;
       border:1px solid var(--line);border-radius:2px;color:var(--mute)}
  .none{font-family:var(--mono);font-size:12px;color:var(--mute)}
  footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);
         font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>{{TITLE}}</h1>
    <div class="sub">{{SUBTITLE}}</div>
  </header>

  {{RULES}}

  <div class="controls">
    {{CHIPS}}
    <input class="search" id="q" type="search" placeholder="search tags, titles…" aria-label="Search references">
  </div>

  <div class="grid" id="grid">
    {{CARDS}}
  </div>

  <footer>GENERATED {{GENERATED}} · TASTE-BOARD</footer>
</div>

<script>
(function(){
  var cards=[].slice.call(document.querySelectorAll('.card')),
      chips=[].slice.call(document.querySelectorAll('.chip')),
      q=document.getElementById('q'), filter='*';
  function apply(){
    var term=(q.value||'').trim().toLowerCase();
    cards.forEach(function(c){
      var okF = filter==='*' || c.dataset.c===filter,
          okQ = !term || (c.dataset.s||'').indexOf(term)>-1;
      c.classList.toggle('hide', !(okF&&okQ));
    });
  }
  chips.forEach(function(ch){
    ch.addEventListener('click',function(){
      chips.forEach(function(x){x.classList.remove('active')});
      ch.classList.add('active'); filter=ch.dataset.f; apply();
    });
  });
  q.addEventListener('input',apply);
})();
</script>
</body>
</html>
